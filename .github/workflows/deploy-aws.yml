name: Deploy AWS

on:
  workflow_dispatch:
    inputs:
      deploy_static_site:
        description: Upload Study and Game static files to S3
        required: true
        default: true
        type: boolean

permissions:
  id-token: write
  contents: read

concurrency:
  group: aws-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy serverless stack
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      STACK_NAME: ${{ vars.AWS_STACK_NAME }}
      ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS }}
      STUDY_BUCKET: ${{ vars.STUDY_BUCKET }}
      SITE_BASE_URL: ${{ vars.SITE_BASE_URL }}
      STUDY_URL: ${{ vars.STUDY_URL }}
      GAME_URL: ${{ vars.GAME_URL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Set up AWS SAM
        uses: aws-actions/setup-sam@v2

      - name: Authenticate to AWS with OIDC
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-${{ github.run_id }}

      - name: Install and verify
        working-directory: backend
        run: |
          npm ci
          npm run check

      - name: Validate and build SAM
        working-directory: infra
        run: |
          sam validate --lint
          sam build

      - name: Deploy SAM stack
        working-directory: infra
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          sam deploy \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --resolve-s3 \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              JwtSecret="$JWT_SECRET" \
              AllowedOrigins="$ALLOWED_ORIGINS"

      - name: Read API URL
        id: stack
        shell: bash
        run: |
          api_url="$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" \
            --output text)"
          echo "api_url=$api_url" >> "$GITHUB_OUTPUT"
          echo "API URL: $api_url" >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare static Study and Game files
        if: ${{ inputs.deploy_static_site }}
        working-directory: backend
        env:
          API_BASE_URL: ${{ steps.stack.outputs.api_url }}
        run: npm run prepare:static

      - name: Upload static site to S3
        if: ${{ inputs.deploy_static_site }}
        run: aws s3 sync backend/dist/static-site/ "s3://$STUDY_BUCKET/" --delete

      - name: Deployment summary
        shell: bash
        run: |
          echo "### Chrome Flashcard deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "- Stack: \`$STACK_NAME\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Region: \`$AWS_REGION\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Static site: \`${STUDY_URL:-$SITE_BASE_URL/study/}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Chrome extension configuration remains a manual release step." >> "$GITHUB_STEP_SUMMARY"
