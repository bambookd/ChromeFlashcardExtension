<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Flashcard Vocabulary</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none">
              <path d="M7 6.5h10M7 10.5h7M7 14.5h5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path>
              <path d="M5.5 3.5h13a2 2 0 0 1 2 2v13a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2v-13a2 2 0 0 1 2-2Z" stroke="currentColor" stroke-width="1.5"></path>
            </svg>
          </span>
          <div class="brand-text">
            <h1>Flashcards</h1>
            <p id="cardCount">0 saved cards</p>
          </div>
        </div>
        <div class="header-actions">
          <button id="themeToggle" class="icon-button" type="button" title="Toggle dark mode" aria-label="Toggle dark mode">
            <span class="icon-glyph" aria-hidden="true">◐</span>
          </button>
          <button id="openStudyButton" class="ghost-button study-button" type="button" title="Open study web app">
            <span>Study</span>
            <span aria-hidden="true">↗</span>
          </button>
        </div>
      </header>

      <section class="panel auth-panel" aria-label="Cloud account">
        <div id="loggedOutView">
          <p class="section-title">Cloud account</p>
          <form id="authForm" autocomplete="off">
            <div class="field-grid">
              <label>
                <span>Username</span>
                <input id="usernameInput" name="username" type="text" placeholder="student" required>
              </label>

              <label>
                <span>Password</span>
                <input id="passwordInput" name="password" type="password" placeholder="••••••••" required>
              </label>
            </div>
            <div class="auth-actions">
              <button id="loginButton" class="primary-button" type="submit">Login</button>
              <button id="registerButton" class="secondary-button" type="button">Register</button>
            </div>
          </form>
        </div>

        <div id="loggedInView" class="logged-in is-hidden">
          <span class="avatar" id="accountAvatar" aria-hidden="true"></span>
          <div class="account-info">
            <strong id="accountName"></strong>
            <p class="account-state">
              <span class="status-dot" aria-hidden="true"></span>
              Cloud connected
            </p>
          </div>
          <button id="logoutButton" class="secondary-button" type="button">Logout</button>
        </div>
      </section>

      <section class="panel capture-panel" aria-label="Add flashcard">
        <div class="panel-heading">
          <div>
            <p class="section-title">Quick capture</p>
            <p class="section-copy">Save a word now, review it when you are ready.</p>
          </div>
          <span class="step-badge">01</span>
        </div>
        <form id="flashcardForm" autocomplete="off">
          <label>
            <span>Word</span>
            <input id="wordInput" name="word" type="text" placeholder="e.g. resilient" required>
          </label>

          <label>
            <span>Meaning</span>
            <textarea id="meaningInput" name="meaning" rows="3" placeholder="Short definition or meaning" required></textarea>
          </label>

          <div class="field-grid">
            <label>
              <span>Wordform</span>
              <select id="wordformInput" name="wordform">
                <option value="">Select type</option>
                <option value="noun">Noun</option>
                <option value="verb">Verb</option>
                <option value="adjective">Adjective</option>
                <option value="adverb">Adverb</option>
                <option value="pronoun">Pronoun</option>
                <option value="preposition">Preposition</option>
                <option value="conjunction">Conjunction</option>
                <option value="interjection">Interjection</option>
                <option value="phrase">Phrase</option>
                <option value="phrasal verb">Phrasal verb</option>
                <option value="idiom">Idiom</option>
                <option value="unknown">Unknown</option>
              </select>
            </label>

            <label>
              <span>Category</span>
              <div class="category-row">
                <select id="categoryInput" name="category">
                  <option value="Uncategorized">Uncategorized</option>
                  <option value="__add_category__">+ Add category</option>
                </select>
                <button id="deleteCategoryButton" class="icon-button danger-ghost" type="button" title="Delete category" aria-label="Delete category">
                  <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M2.5 4h11M6.5 4V2.5h3V4M4 4l.6 9a1 1 0 0 0 1 .9h4.8a1 1 0 0 0 1-.9L12 4"></path>
                  </svg>
                </button>
              </div>
            </label>
          </div>

          <button class="primary-button save-button" type="submit">
            <span aria-hidden="true">＋</span>
            Add to library
          </button>
        </form>
      </section>

      <section class="toolbar" aria-label="Flashcard actions">
        <button id="syncButton" class="secondary-button" type="button">Sync to Cloud</button>
        <button id="exportButton" class="secondary-button" type="button">Export JSON</button>
        <button id="clearButton" class="secondary-button danger-button" type="button">Clear local</button>
      </section>

      <p id="statusMessage" class="status" role="status" aria-live="polite"></p>

      <section class="card-list" aria-label="Saved flashcards">
        <div class="list-header">
          <p class="section-title">Saved cards</p>
          <input id="searchInput" class="search-input" type="search" placeholder="Search cards" aria-label="Search saved flashcards">
        </div>

        <div id="emptyState" class="empty-state">
          <span class="empty-illustration" aria-hidden="true">
            <svg viewBox="0 0 48 48" width="38" height="38" fill="none">
              <rect x="10" y="8" width="28" height="34" rx="6" stroke="currentColor" stroke-width="2"></rect>
              <path d="M17 18h14M17 24h10M17 30h7" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
              <path d="M33 34l2.5 2.5L40 32" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
            </svg>
          </span>
          <p class="empty-title">No flashcards yet</p>
          <p class="empty-hint">Save a word above, or select text on any page and use the right-click menu.</p>
        </div>

        <ul id="flashcardList"></ul>
      </section>
    </main>

    <script src="extension-config.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
